# Judô Master — deploy to GitHub Pages
#
# Runs ONLY when the "CI" workflow completes successfully on main, so nothing
# reaches users without passing the whole quality gate:
#   lint → typecheck → unit tests → data & icons → security → e2e → build
#
# Publishes dist/ to the gh-pages branch, which GitHub Pages serves
# (Settings → Pages → Source: "Deploy from a branch", gh-pages, / root).

name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  # Manual redeploy of main, still only after a green CI run (see `if:` below).
  workflow_dispatch:

# Never two deploys at once, and never cancel one halfway.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → GitHub Pages
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    permissions:
      contents: write
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - run: npm ci

      - name: Production build
        run: npm run build

      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Adds .nojekyll, so GitHub Pages serves the files as they are.
          enable_jekyll: false
          commit_message: 'deploy: ${{ github.event.workflow_run.head_sha || github.sha }}'
