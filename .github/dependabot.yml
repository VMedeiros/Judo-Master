# Judô Master — Dependabot: dependências atualizadas automaticamente
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'
    labels:
      - 'dependencies'
      - 'npm'
    ignore:
      # SheetJS is installed from its own CDN, not the npm registry.
      - dependency-name: 'xlsx'
      # Angular majors need `ng update`, which runs the code migrations and
      # moves TypeScript to the range the new compiler accepts. Dependabot
      # can do neither, so its major PRs always fail with ERESOLVE.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-eslint/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'angular-eslint'
        update-types: ['version-update:semver-major']
      # The Angular compiler accepts a single TypeScript minor
      # (Angular 22: >=6.0 <6.1); `ng update` moves it with each major.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
      # Node type definitions follow the Node major the project runs on (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Angular packages pin each other as peers, so their updates must
      # land together in one PR.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
          - 'typescript'
      typescript:
        patterns:
          - '@types/*'
      testing:
        patterns:
          - 'karma*'
          - 'jasmine*'
          - '@playwright/*'
          - '@axe-core/*'
      linting:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
      - 'github-actions'
