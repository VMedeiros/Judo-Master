    <style>
      /* ============================================================
         Custom Scrollbar
         ============================================================ */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(156, 163, 175, 0.4);
        border-radius: 20px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(156, 163, 175, 0.6);
      }
      .dark ::-webkit-scrollbar-thumb {
        background-color: rgba(75, 85, 99, 0.4);
      }

      /* ============================================================
         Background — foto de judô com overlay (igual tela de login JudoKan)
         ============================================================ */
      body {
        font-family: "Inter", "Noto Sans JP", sans-serif;
        background-color: #0a1422;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("https://images.unsplash.com/photo-1656653121475-e33829581294?q=80&w=1170&auto=format&fit=crop");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        z-index: -3;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(
          to right,
          rgba(10, 30, 60, 0.88) 0%,
          rgba(10, 30, 60, 0.6) 40%,
          rgba(10, 30, 60, 0.4) 100%
        );
        z-index: -2;
      }

      /* Tema claro — overlay e fundo adaptados */
      html:not(.dark) body {
        background-color: #7aa8c4;
      }
      html:not(.dark) body::after {
        background: rgba(235, 242, 248, 0.72);
      }

      /* ============================================================
         Premium Splash Screen (identidade JudoKan)
         ============================================================ */
      #app-splash {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: linear-gradient(
          135deg,
          #0a1929 0%,
          #102a43 50%,
          #192a3e 100%
        );
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition:
          opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0.8s,
          transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }

      /* Partículas flutuantes */
      .splash-particles {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .splash-particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: rgba(14, 165, 233, 0.3);
        border-radius: 50%;
        animation: float-particle 8s infinite ease-in-out;
      }
      .splash-particle:nth-child(1) {
        left: 10%;
        top: 20%;
        animation-delay: 0s;
        animation-duration: 6s;
      }
      .splash-particle:nth-child(2) {
        left: 20%;
        top: 80%;
        animation-delay: 1s;
        animation-duration: 8s;
      }
      .splash-particle:nth-child(3) {
        left: 30%;
        top: 40%;
        animation-delay: 2s;
        animation-duration: 7s;
      }
      .splash-particle:nth-child(4) {
        left: 50%;
        top: 60%;
        animation-delay: 0.5s;
        animation-duration: 9s;
      }
      .splash-particle:nth-child(5) {
        left: 70%;
        top: 30%;
        animation-delay: 1.5s;
        animation-duration: 6s;
      }
      .splash-particle:nth-child(6) {
        left: 80%;
        top: 70%;
        animation-delay: 2.5s;
        animation-duration: 8s;
      }
      .splash-particle:nth-child(7) {
        left: 90%;
        top: 50%;
        animation-delay: 0.7s;
        animation-duration: 7s;
      }
      .splash-particle:nth-child(8) {
        left: 40%;
        top: 10%;
        animation-delay: 1.2s;
        animation-duration: 9s;
      }

      /* Rings pulsantes atrás do logo */
      .splash-rings {
        position: absolute;
        width: 200px;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-ring {
        position: absolute;
        width: 120px;
        height: 120px;
        border: 1px solid rgba(14, 165, 233, 0.2);
        border-radius: 50%;
        animation: ring-expand 3s infinite ease-out;
      }
      .splash-ring:nth-child(1) {
        animation-delay: 0s;
      }
      .splash-ring:nth-child(2) {
        animation-delay: 1s;
      }
      .splash-ring:nth-child(3) {
        animation-delay: 2s;
      }

      .splash-logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-logo {
        position: relative;
        z-index: 1;
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 0 60px rgba(14, 165, 233, 0.3),
          0 20px 40px rgba(0, 0, 0, 0.3);
        animation:
          pulse-glow-splash 2s infinite,
          entrance-bounce 0.6s ease-out;
        overflow: hidden;
      }
      .splash-logo::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          45deg,
          transparent,
          rgba(255, 255, 255, 0.15),
          transparent
        );
        animation: shine-logo 3s infinite;
      }
      .splash-kanji {
        font-family: "Noto Sans JP", serif;
        font-size: 42px;
        font-weight: 700;
        color: #102a43;
        animation: kanji-appear 0.8s ease-out 0.3s both;
      }

      .splash-title {
        margin-top: 24px;
        font-family: "Inter", sans-serif;
        color: white;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -1px;
        text-shadow: 0 2px 20px rgba(14, 165, 233, 0.3);
        animation: text-slide-up 0.6s ease-out 0.4s both;
      }
      .splash-subtitle {
        margin-top: 8px;
        color: #0ea5e9;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 4px;
        font-weight: 600;
        animation: text-slide-up 0.6s ease-out 0.5s both;
      }

      .loader-container {
        margin-top: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        animation: text-slide-up 0.6s ease-out 0.6s both;
      }
      .loader-bar {
        width: 240px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
      }
      .loader-progress {
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          #0284c7,
          #38bdf8,
          #0ea5e9,
          #38bdf8,
          #0284c7
        );
        background-size: 300% 100%;
        border-radius: 4px;
        animation: loading-bar 1.5s ease-in-out infinite;
      }
      .loader-dots {
        display: flex;
        gap: 4px;
        margin-top: 4px;
      }
      .loader-dot {
        width: 6px;
        height: 6px;
        background: rgba(14, 165, 233, 0.4);
        border-radius: 50%;
        animation: dot-pulse 1.4s ease-in-out infinite;
      }
      .loader-dot:nth-child(1) {
        animation-delay: 0s;
      }
      .loader-dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .loader-dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      .loader-text {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.5);
        font-weight: 500;
        letter-spacing: 1px;
      }

      .splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: scale(1.05);
      }

      /* ============================================================
         Keyframes
         ============================================================ */
      @keyframes float-particle {
        0%,
        100% {
          transform: translateY(0) scale(1);
          opacity: 0.3;
        }
        50% {
          transform: translateY(-30px) scale(1.2);
          opacity: 0.6;
        }
      }
      @keyframes ring-expand {
        0% {
          transform: scale(1);
          opacity: 0.4;
        }
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }
      @keyframes entrance-bounce {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        60% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes kanji-appear {
        0% {
          transform: scale(0.8);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes text-slide-up {
        0% {
          transform: translateY(20px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @keyframes pulse-glow-splash {
        0%,
        100% {
          box-shadow:
            0 0 30px rgba(14, 165, 233, 0.3),
            0 20px 40px rgba(0, 0, 0, 0.3);
        }
        50% {
          box-shadow:
            0 0 60px rgba(14, 165, 233, 0.5),
            0 25px 50px rgba(0, 0, 0, 0.4);
        }
      }
      @keyframes shine-logo {
        0% {
          transform: translateX(-100%) rotate(45deg);
        }
        100% {
          transform: translateX(100%) rotate(45deg);
        }
      }
      @keyframes loading-bar {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: -100% 0;
        }
      }
      @keyframes dot-pulse {
        0%,
        80%,
        100% {
          transform: scale(0.6);
          opacity: 0.4;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* ============================================================
         Skeleton
         ============================================================ */
      .skeleton {
        background: linear-gradient(
          90deg,
          #e5e7eb 25%,
          #f3f4f6 50%,
          #e5e7eb 75%
        );
        background-size: 200% 100%;
        animation: skeleton-anim 1.5s infinite;
        border-radius: 8px;
      }
      .dark .skeleton {
        background: linear-gradient(
          90deg,
          #374151 25%,
          #4b5563 50%,
          #374151 75%
        );
        background-size: 200% 100%;
      }
      @keyframes skeleton-anim {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }

      /* ============================================================
         Responsive
         ============================================================ */
      @media (max-width: 480px) {
        .splash-logo {
          width: 80px;
          height: 80px;
          border-radius: 20px;
        }
        .splash-kanji {
          font-size: 34px;
        }
        .splash-title {
          font-size: 24px;
          margin-top: 20px;
        }
        .splash-subtitle {
          font-size: 10px;
          letter-spacing: 3px;
        }
        .loader-bar {
          width: 200px;
        }
        .loader-container {
          margin-top: 36px;
        }
      }

      /* Prefers reduced motion */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>

    <script type="module">
      if ("serviceWorker" in navigator) {
        const _isLocalDev = ["localhost", "127.0.0.1", "0.0.0.0"].includes(
          location.hostname,
        );
        if (_isLocalDev) {
          const regs = await navigator.serviceWorker.getRegistrations();
          regs.forEach((r) => r.unregister());
        } else {
          window.addEventListener("load", async () => {
            try {
              await navigator.serviceWorker.register("ngsw-worker.js");
            } catch (err) {
              console.warn("SW registration failed:", err);
            }
            let reloaded = false;
            navigator.serviceWorker.addEventListener("controllerchange", () => {
              if (reloaded) return;
              reloaded = true;
              globalThis.location.reload();
            });
          });
        }
      }
    </script>

    <script>
      (function () {
        const splash = document.getElementById("app-splash");
        const splashStatus = document.getElementById("splash-status");
        const loaderText = splash && splash.querySelector(".loader-text");
        if (!splash) return;

        const messages = [
          "Carregando recursos...",
          "Preparando interface...",
          "Quase pronto...",
        ];
        let idx = 0;
        const interval = setInterval(() => {
          idx = (idx + 1) % messages.length;
          if (loaderText) loaderText.textContent = messages[idx];
          if (splashStatus) splashStatus.textContent = messages[idx];
        }, 800);

        const hideSplash = () => {
          clearInterval(interval);
          if (loaderText) loaderText.textContent = "Pronto!";
          if (splashStatus)
            splashStatus.textContent = "Aplicação carregada com sucesso.";
          requestAnimationFrame(() => {
            splash.classList.add("splash-hidden");
            splash.setAttribute("aria-hidden", "true");
            splash.setAttribute("aria-busy", "false");
            setTimeout(() => {
              if (splash.parentNode) splash.remove();
            }, 800);
          });
        };

        globalThis.addEventListener("angular-ready", hideSplash, {
          once: true,
        });
        globalThis.addEventListener("DOMContentLoaded", () =>
          setTimeout(hideSplash, 2000),
        );
        setTimeout(hideSplash, 5000);
      })();
    </script>
