<header class="header-premium sticky top-0 z-40 shadow-md">
  <div class="container mx-auto px-3 sm:px-6 lg:px-8">
    <div class="flex h-14 items-center justify-between sm:h-16">
      <div class="flex items-center gap-2 sm:gap-3">
        <img
          [src]="
            theme.isDarkMode() ? 'assets/icons/icon-192x192-dark.png' : 'assets/icons/icon-192x192.png'
          "
          class="h-8 w-8 rounded-xl sm:h-10 sm:w-10"
          alt=""
          width="40"
          height="40"
        />
        <h1 class="accessible-heading text-lg leading-none font-bold sm:text-xl lg:text-2xl">
          <span class="accent-text font-serif">Judô</span>
          <span class="high-contrast-text font-sans">Master</span>
        </h1>
      </div>

      <button
        type="button"
        class="btn btn-secondary"
        aria-label="Configurações"
        title="Configurações"
        aria-haspopup="dialog"
        (click)="openSettings.emit()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">settings</span>
      </button>
    </div>
  </div>
</header>
