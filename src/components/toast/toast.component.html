@if (notification.successMessage().show) {
  <output
    class="fixed bottom-8 right-4 sm:right-8 z-[200] max-w-sm w-[calc(100%-2rem)] sm:w-auto"
    aria-live="polite"
    aria-atomic="true"
  >
    <div
      class="bg-gradient-to-r from-green-500 to-green-600 dark:from-green-600 dark:to-green-700 rounded-xl p-4 shadow-2xl flex items-center gap-3"
    >
      <span
        class="material-symbols-rounded text-2xl text-white flex-shrink-0"
        aria-hidden="true"
        >check_circle</span
      >
      <p class="font-semibold text-white text-sm">
        {{ notification.successMessage().text }}
      </p>
    </div>
  </output>
}

@if (notification.errorMessage().show) {
  <output
    class="fixed bottom-8 right-4 sm:right-8 z-[200] max-w-sm w-[calc(100%-2rem)] sm:w-auto"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div
      class="bg-gradient-to-r from-red-500 to-red-600 dark:from-red-600 dark:to-red-700 rounded-xl p-4 shadow-2xl flex items-center gap-3"
    >
      <span
        class="material-symbols-rounded text-2xl text-white flex-shrink-0"
        aria-hidden="true"
        >error</span
      >
      <p class="font-semibold text-white text-sm">
        {{ notification.errorMessage().text }}
      </p>
    </div>
  </output>
}
