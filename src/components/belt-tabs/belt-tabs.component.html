<nav class="card mb-6" aria-label="Faixas de graduação">
  <!-- Phones: a native select -->
  <div class="p-2 sm:hidden">
    <label for="belt-select" class="sr-only">Selecionar faixa de graduação</label>
    <select id="belt-select" class="input block w-full" (change)="onSelectChange($event)">
      @for (belt of belts(); track belt.id; let i = $index) {
        <option [value]="i" [selected]="i === selectedIndex()">{{ belt.name }}</option>
      }
    </select>
  </div>

  <!-- Larger screens: tabs with arrow-key navigation -->
  <div
    class="hidden flex-wrap gap-2 p-2 sm:flex"
    role="tablist"
    aria-label="Faixas de graduação"
    tabindex="-1"
    (keydown)="onTablistKeydown($event)"
  >
    @for (belt of belts(); track belt.id; let i = $index) {
      <button
        #tabButton
        type="button"
        role="tab"
        class="flex items-center rounded-xl px-3 py-2 text-sm font-medium whitespace-nowrap transition-all duration-200"
        [class]="i === selectedIndex() ? 'pill-active' : 'text-theme hover:bg-theme-alt opacity-70 hover:opacity-100'"
        [id]="'belt-tab-' + belt.id"
        [attr.aria-selected]="i === selectedIndex()"
        [attr.aria-controls]="'belt-panel-' + belt.id"
        [attr.tabindex]="i === selectedIndex() ? 0 : -1"
        (click)="beltSelected.emit(i)"
      >
        <span
          class="mr-2 inline-block h-4 w-4 shrink-0 rounded-full border border-gray-400 dark:border-gray-500"
          [class]="belt.color"
          aria-hidden="true"
        ></span>
        {{ belt.name }}
      </button>
    }
  </div>
</nav>
