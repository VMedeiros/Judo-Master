@if (celebration(); as celebration) {
  <section class="celebration-card card mb-6 border-2 p-4 text-center sm:p-6" aria-labelledby="celebration-title">
    <div class="mb-2 flex items-center justify-center gap-3">
      <span class="text-4xl sm:text-6xl" aria-hidden="true">{{ celebration.icon }}</span>
      <h2 id="celebration-title" class="accent-text font-serif text-2xl font-bold sm:text-3xl">
        {{ celebration.name }}
      </h2>
      <span class="text-4xl sm:text-6xl" aria-hidden="true">{{ celebration.icon }}</span>
    </div>
    <p class="text-theme text-sm font-medium sm:text-base">Celebrando este momento especial!</p>
  </section>
}
