<app-modal [title]="technique().name" [subtitle]="technique().translation" size="lg" (closed)="closed.emit()">
  <span
    class="bg-theme-alt text-theme border-theme mb-4 inline-block rounded-full border px-2.5 py-0.5 text-xs font-medium"
  >
    {{ technique().category }}
  </span>

  <div class="space-y-4 text-sm sm:text-base">
    <p class="text-theme leading-relaxed">{{ technique().description }}</p>

    @if (technique().execution) {
      <section>
        <h3 class="high-contrast-text mb-1 flex items-center gap-2 font-semibold">
          <span class="material-symbols-rounded accent-text text-[18px]" aria-hidden="true">sports_martial_arts</span>
          Execução
        </h3>
        <p class="text-theme bg-theme-alt rounded-lg p-3 leading-relaxed">{{ technique().execution }}</p>
      </section>
    }

    @if (technique().application) {
      <section>
        <h3 class="high-contrast-text mb-1 flex items-center gap-2 font-semibold">
          <span class="material-symbols-rounded accent-text text-[18px]" aria-hidden="true">target</span>
          Aplicação
        </h3>
        <p class="text-theme bg-theme-alt rounded-lg p-3 leading-relaxed">{{ technique().application }}</p>
      </section>
    }

    @if (hasVideo()) {
      <button type="button" class="btn btn-accent" (click)="watchVideo.emit()">
        <span class="material-symbols-rounded text-[18px]" aria-hidden="true">play_circle</span>
        Assistir demonstração
      </button>
    }
  </div>

  <ng-container modalFooter>
    <div class="flex w-full items-center justify-between gap-3">
      <button
        type="button"
        class="btn btn-ghost"
        aria-label="Técnica anterior"
        [disabled]="!hasPrevious()"
        (click)="previous.emit()"
      >
        <span class="material-symbols-rounded text-[20px]" aria-hidden="true">chevron_left</span>
        <span class="hidden sm:inline">Anterior</span>
      </button>
      <button type="button" class="btn" (click)="closed.emit()">Fechar</button>
      <button
        type="button"
        class="btn btn-ghost"
        aria-label="Próxima técnica"
        [disabled]="!hasNext()"
        (click)="next.emit()"
      >
        <span class="hidden sm:inline">Próxima</span>
        <span class="material-symbols-rounded text-[20px]" aria-hidden="true">chevron_right</span>
      </button>
    </div>
  </ng-container>
</app-modal>
