@if (technique) {
  <div
    class="fixed inset-0 bg-black/60 z-40 flex items-center justify-center p-3 sm:p-4"
    (click)="closed.emit()"
    (keydown.escape)="closed.emit()"
  >
    <dialog
      open
      class="static card max-w-2xl w-full max-h-[90vh] overflow-y-auto rounded-2xl"
      aria-labelledby="detail-title"
      (click)="$event.stopPropagation()"
      (keydown.escape)="closed.emit()"
    >
      <div class="p-4 sm:p-6">
        <!-- Header -->
        <div
          class="flex justify-between items-start border-b border-theme pb-3 mb-4"
        >
          <div>
            <h3
              id="detail-title"
              class="text-xl sm:text-2xl font-bold accessible-heading font-serif"
            >
              {{ technique.name }}
            </h3>
            <p class="text-sm text-theme italic mt-0.5">
              {{ technique.translation }}
            </p>
            <span
              class="inline-block mt-2 text-xs font-medium px-2 py-0.5 rounded-full bg-theme-alt text-theme border border-theme"
            >
              {{ technique.category }}
            </span>
          </div>
          <button
            type="button"
            class="p-1.5 rounded-lg hover:bg-theme-alt transition-colors flex-shrink-0 ml-3"
            [attr.aria-label]="'Fechar detalhes de ' + technique.name"
            (click)="closed.emit()"
          >
            <span
              class="material-symbols-rounded text-[22px]"
              aria-hidden="true"
              >close</span
            >
          </button>
        </div>

        <!-- Content -->
        <div class="space-y-4 text-sm sm:text-base">
          <p class="text-theme leading-relaxed">{{ technique.description }}</p>

          <div>
            <h4
              class="font-semibold high-contrast-text mb-1 flex items-center gap-2"
            >
              <span
                class="material-symbols-rounded text-[18px] accent-text"
                aria-hidden="true"
                >sports_martial_arts</span
              >
              Execução:
            </h4>
            <p class="text-theme leading-relaxed bg-theme-alt rounded-lg p-3">
              {{ technique.execution }}
            </p>
          </div>

          <div>
            <h4
              class="font-semibold high-contrast-text mb-1 flex items-center gap-2"
            >
              <span
                class="material-symbols-rounded text-[18px] accent-text"
                aria-hidden="true"
                >target</span
              >
              Aplicação:
            </h4>
            <p class="text-theme leading-relaxed bg-theme-alt rounded-lg p-3">
              {{ technique.application }}
            </p>
          </div>
        </div>

        <!-- Navigation -->
        <div
          class="mt-6 pt-4 border-t border-theme flex items-center justify-between gap-3"
        >
          <button
            type="button"
            class="btn btn-ghost flex items-center gap-1.5"
            aria-label="Técnica anterior"
            (click)="previousTechnique.emit()"
          >
            <span
              class="material-symbols-rounded text-[20px]"
              aria-hidden="true"
              >chevron_left</span
            >
            <span class="hidden sm:inline text-sm">Anterior</span>
          </button>
          <button
            type="button"
            class="btn"
            aria-label="Fechar modal"
            (click)="closed.emit()"
          >
            Fechar
          </button>
          <button
            type="button"
            class="btn btn-ghost flex items-center gap-1.5"
            aria-label="Próxima técnica"
            (click)="nextTechnique.emit()"
          >
            <span class="hidden sm:inline text-sm">Próxima</span>
            <span
              class="material-symbols-rounded text-[20px]"
              aria-hidden="true"
              >chevron_right</span
            >
          </button>
        </div>
      </div>
    </dialog>
  </div>
}
