@if (technique) {
  <div
    class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3 sm:p-4"
    (click)="closed.emit()"
    (keydown.escape)="closed.emit()"
  >
    <dialog
      open
      role="alertdialog"
      class="static card max-w-md w-full rounded-2xl"
      aria-labelledby="delete-title"
      (keydown.escape)="closed.emit()"
      aria-describedby="delete-description"
      (click)="$event.stopPropagation()"
    >
      <div class="p-5 sm:p-6 text-center">
        <div
          class="w-14 h-14 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center mx-auto mb-4"
        >
          <span
            class="material-symbols-rounded text-3xl text-red-500 dark:text-red-400"
            aria-hidden="true"
            >warning</span
          >
        </div>
        <h3
          id="delete-title"
          class="text-lg font-semibold high-contrast-text mb-2"
        >
          Confirmar remoção
        </h3>
        <p
          id="delete-description"
          class="text-sm text-theme mb-6 leading-relaxed"
        >
          Tem certeza que deseja remover a técnica
          <strong class="high-contrast-text">"{{ technique.name }}"</strong>?
          Esta ação não pode ser desfeita.
        </p>
        <div class="flex flex-col sm:flex-row gap-2 sm:gap-3 justify-center">
          <button
            type="button"
            class="btn order-2 sm:order-1"
            (click)="closed.emit()"
          >
            Cancelar
          </button>
          <button
            type="button"
            class="btn bg-red-500 hover:bg-red-600 text-white border-red-500 hover:border-red-600 order-1 sm:order-2"
            (click)="confirmed.emit()"
          >
            <span
              class="material-symbols-rounded text-[18px]"
              aria-hidden="true"
              >delete</span
            >
            Sim, remover
          </button>
        </div>
      </div>
    </dialog>
  </div>
}
