<app-modal [title]="technique().name" [subtitle]="technique().translation" size="xl" (closed)="closed.emit()">
  @if (embedUrl(); as url) {
    <div class="relative aspect-video w-full overflow-hidden rounded-xl bg-black">
      <iframe
        class="absolute inset-0 h-full w-full border-0"
        [src]="url"
        [title]="'Demonstração de ' + technique().name"
        allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </div>
    @if (watchUrl(); as link) {
      <p class="mt-3 text-right text-xs">
        <a class="accent-text inline-flex items-center gap-1 font-semibold hover:underline" [href]="link" target="_blank" rel="noopener noreferrer">
          Abrir no YouTube
          <span class="material-symbols-rounded text-[14px]" aria-hidden="true">open_in_new</span>
          <span class="sr-only">(abre em nova aba)</span>
        </a>
      </p>
    }
  } @else {
    <div class="py-10 text-center text-gray-600 dark:text-gray-400">
      <span class="material-symbols-rounded mb-3 block text-5xl" aria-hidden="true">videocam_off</span>
      <p class="font-medium">Demonstração não disponível para esta técnica.</p>
    </div>
  }

  <ng-container modalFooter>
    <div class="flex w-full items-center justify-between gap-3">
      <button
        type="button"
        class="btn btn-ghost"
        aria-label="Vídeo anterior"
        [disabled]="!hasPrevious()"
        (click)="previous.emit()"
      >
        <span class="material-symbols-rounded text-[20px]" aria-hidden="true">chevron_left</span>
        <span class="hidden sm:inline">Anterior</span>
      </button>
      <button type="button" class="btn" (click)="closed.emit()">Fechar</button>
      <button
        type="button"
        class="btn btn-ghost"
        aria-label="Próximo vídeo"
        [disabled]="!hasNext()"
        (click)="next.emit()"
      >
        <span class="hidden sm:inline">Próximo</span>
        <span class="material-symbols-rounded text-[20px]" aria-hidden="true">chevron_right</span>
      </button>
    </div>
  </ng-container>
</app-modal>
