@if (technique) {
  <div
    class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-3 sm:p-4"
    (click)="closed.emit()"
    (keydown.escape)="closed.emit()"
  >
    <dialog
      open
      class="static card max-w-4xl w-full rounded-2xl"
      aria-labelledby="video-title"
      (click)="$event.stopPropagation()"
      (keydown.escape)="closed.emit()"
    >
      <div class="p-4 sm:p-6">
        <!-- Header -->
        <div class="flex justify-between items-center mb-4">
          <div>
            <h3
              id="video-title"
              class="text-lg sm:text-xl font-bold accessible-heading font-serif"
            >
              {{ technique.name }}
            </h3>
            <p class="text-sm text-theme italic">{{ technique.translation }}</p>
          </div>
          <button
            type="button"
            class="p-1.5 rounded-lg hover:bg-theme-alt transition-colors flex-shrink-0 ml-3"
            [attr.aria-label]="'Fechar vídeo de ' + technique.name"
            (click)="closed.emit()"
          >
            <span
              class="material-symbols-rounded text-[22px]"
              aria-hidden="true"
              >close</span
            >
          </button>
        </div>

        <!-- Video or fallback -->
        @if (safeUrl) {
          <div
            class="video-wrapper relative w-full rounded-xl overflow-hidden bg-black"
          >
            <iframe
              [src]="safeUrl"
              class="absolute inset-0 w-full h-full"
              [title]="'Demonstração de ' + technique.name"
              style="border: 0"
              allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
              "
              allowfullscreen
              loading="lazy"
            ></iframe>
          </div>
        } @else {
          <div class="py-10 text-center text-gray-500 dark:text-gray-400">
            <span
              class="material-symbols-rounded text-5xl mb-3 block"
              aria-hidden="true"
              >videocam_off</span
            >
            <p class="font-medium">
              Demonstração não disponível para esta técnica.
            </p>
          </div>
        }

        <!-- Navigation -->
        <div
          class="mt-4 pt-4 border-t border-theme flex items-center justify-between gap-3"
        >
          <button
            type="button"
            class="btn btn-ghost flex items-center gap-1.5"
            aria-label="Técnica anterior"
            (click)="previousVideo.emit()"
          >
            <span
              class="material-symbols-rounded text-[20px]"
              aria-hidden="true"
              >chevron_left</span
            >
            <span class="hidden sm:inline text-sm">Anterior</span>
          </button>
          <button
            type="button"
            class="btn"
            aria-label="Fechar vídeo"
            (click)="closed.emit()"
          >
            Fechar
          </button>
          <button
            type="button"
            class="btn btn-ghost flex items-center gap-1.5"
            aria-label="Próxima técnica"
            (click)="nextVideo.emit()"
          >
            <span class="hidden sm:inline text-sm">Próxima</span>
            <span
              class="material-symbols-rounded text-[20px]"
              aria-hidden="true"
              >chevron_right</span
            >
          </button>
        </div>
      </div>
    </dialog>
  </div>
}
