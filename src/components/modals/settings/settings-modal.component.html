<app-modal title="Configurações" size="popover" (closed)="closed.emit()">
  <span modalIcon class="material-symbols-rounded accent-text mt-0.5" aria-hidden="true">tune</span>

  <div class="space-y-5 p-5">
    <div class="flex items-start">
      <!-- Tema -->
      <div class="flex-1">
        <p class="settings-label">
          <span class="material-symbols-rounded text-lg" aria-hidden="true">palette</span>
          Tema
        </p>
        <div class="mt-2 flex items-center gap-3">
          <span
            class="material-symbols-rounded text-xl transition-colors duration-300"
            [class]="theme.isDarkMode() ? 'text-gray-500' : 'text-sky-500'"
            aria-hidden="true"
            >light_mode</span
          >
          <button
            type="button"
            role="switch"
            class="relative flex h-[46px] w-[84px] items-center rounded-[22px] p-[6px] shadow-inner transition-colors duration-500"
            [class]="theme.isDarkMode() ? 'bg-[#7384d1]' : 'bg-gray-200'"
            [attr.aria-checked]="theme.isDarkMode()"
            aria-label="Tema escuro"
            data-autofocus
            (click)="theme.toggleTheme()"
          >
            <span
              class="relative z-10 flex h-[34px] w-[34px] transform items-center justify-center rounded-full shadow-lg transition-all duration-500"
              [class]="theme.isDarkMode() ? 'translate-x-[38px] bg-[#111827]' : 'translate-x-0 bg-white'"
            >
              <span
                class="material-symbols-rounded text-[20px] transition-all duration-500"
                [class]="theme.isDarkMode() ? 'rotate-[-10deg] text-white' : 'text-sky-500'"
                aria-hidden="true"
                >{{ theme.isDarkMode() ? 'dark_mode' : 'light_mode' }}</span
              >
            </span>
          </button>
          <span
            class="material-symbols-rounded text-xl transition-colors duration-300"
            [class]="theme.isDarkMode() ? 'text-[#a5b4fc]' : 'text-gray-400'"
            aria-hidden="true"
            >dark_mode</span
          >
        </div>
      </div>

      <div class="mx-3 w-px self-stretch bg-gray-200 dark:bg-gray-700" aria-hidden="true"></div>

      <!-- Tamanho da fonte -->
      <div class="flex-1">
        <p id="font-size-label" class="settings-label">
          <span class="material-symbols-rounded text-lg" aria-hidden="true">format_size</span>
          Fonte
        </p>
        <div
          class="relative mt-2 flex h-11 items-center overflow-hidden rounded-2xl border border-gray-200 bg-gray-100 p-1 dark:border-gray-700 dark:bg-gray-800/50"
          role="group"
          aria-labelledby="font-size-label"
        >
          <span
            class="absolute top-1 bottom-1 z-0 w-[calc(33.33%-4px)] rounded-xl bg-[#334155] shadow-md transition-all duration-300 dark:bg-[#1e293b]"
            [style.left]="indicatorLeft()"
            aria-hidden="true"
          ></span>
          @for (option of fontSizes; track option.value) {
            <button
              type="button"
              class="relative z-10 h-full flex-1 rounded-xl text-[11px] font-black transition-colors"
              [class]="
                theme.fontSize() === option.value
                  ? 'text-sky-300'
                  : 'text-gray-600 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white'
              "
              [attr.aria-pressed]="theme.fontSize() === option.value"
              [attr.aria-label]="'Fonte ' + option.label"
              [title]="option.label"
              (click)="theme.setFontSize(option.value)"
            >
              {{ option.short }}
            </button>
          }
        </div>
      </div>
    </div>

    <blockquote class="quote-border bg-theme-alt rounded-lg border-l-4 p-3">
      <p class="text-theme text-xs leading-relaxed italic">{{ quote }}</p>
    </blockquote>

    <div class="border-theme space-y-1 border-t pt-3">
      <button type="button" class="menu-item" (click)="openAbout.emit()">
        <span class="material-symbols-rounded accent-text text-[18px]" aria-hidden="true">info</span>
        <span>Sobre o <span class="accent-text font-serif font-bold">Judô</span></span>
      </button>
      <button type="button" class="menu-item" [disabled]="!hasChanges()" (click)="resetTechniques.emit()">
        <span class="material-symbols-rounded text-[18px] text-amber-600 dark:text-amber-400" aria-hidden="true"
          >restart_alt</span
        >
        <span>Restaurar técnicas originais</span>
      </button>
    </div>

    <p class="text-theme-muted text-center text-[11px]">{{ appName }} v{{ version }}</p>
  </div>
</app-modal>
