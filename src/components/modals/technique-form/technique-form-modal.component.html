@if (technique) {
  <div
    class="fixed inset-0 bg-black/60 z-40 flex items-center justify-center p-3 sm:p-4"
    (click)="closed.emit()"
    (keydown.escape)="closed.emit()"
  >
    <dialog
      open
      class="static card max-w-2xl w-full max-h-[90vh] overflow-y-auto rounded-2xl"
      aria-labelledby="form-title"
      (click)="$event.stopPropagation()"
      (keydown.escape)="closed.emit()"
    >
      <form (submit)="onSubmit($event)" novalidate>
        <!-- Form header -->
        <div
          class="flex justify-between items-center p-4 sm:p-6 border-b border-theme"
        >
          <h3
            id="form-title"
            class="text-lg sm:text-xl font-bold accessible-heading"
          >
            {{ mode === "add" ? "Adicionar Nova Técnica" : "Editar Técnica" }}
          </h3>
          <button
            type="button"
            class="p-1.5 rounded-lg hover:bg-theme-alt transition-colors flex-shrink-0 ml-3"
            aria-label="Fechar formulário"
            (click)="closed.emit()"
          >
            <span
              class="material-symbols-rounded text-[22px]"
              aria-hidden="true"
              >close</span
            >
          </button>
        </div>

        <!-- Form body -->
        <div class="p-4 sm:p-6 space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label
                for="tech-name"
                class="block text-sm font-medium text-theme mb-1"
              >
                Nome
                <abbr
                  title="obrigatório"
                  class="text-red-500 no-underline"
                  aria-hidden="true"
                  >*</abbr
                >
              </label>
              <input
                type="text"
                name="name"
                id="tech-name"
                [value]="technique.name"
                required
                minlength="2"
                maxlength="120"
                class="input block w-full"
                aria-required="true"
                autocomplete="off"
              />
            </div>
            <div>
              <label
                for="tech-translation"
                class="block text-sm font-medium text-theme mb-1"
                >Tradução</label
              >
              <input
                type="text"
                name="translation"
                id="tech-translation"
                [value]="technique.translation"
                maxlength="120"
                class="input block w-full"
                autocomplete="off"
              />
            </div>
          </div>

          <div>
            <label
              for="tech-category"
              class="block text-sm font-medium text-theme mb-1"
            >
              Categoria
              <abbr
                title="obrigatório"
                class="text-red-500 no-underline"
                aria-hidden="true"
                >*</abbr
              >
            </label>
            <select
              name="category"
              id="tech-category"
              required
              class="input block w-full"
              aria-required="true"
            >
              @for (category of categories; track category) {
                <option
                  [value]="category"
                  [selected]="technique.category === category"
                >
                  {{ category }}
                </option>
              }
            </select>
          </div>

          <div>
            <label
              for="tech-description"
              class="block text-sm font-medium text-theme mb-1"
            >
              Descrição
              <abbr
                title="obrigatório"
                class="text-red-500 no-underline"
                aria-hidden="true"
                >*</abbr
              >
            </label>
            <textarea
              name="description"
              id="tech-description"
              rows="3"
              required
              maxlength="500"
              class="input block w-full resize-y"
              aria-required="true"
              >{{ technique.description }}</textarea
            >
          </div>

          <div>
            <label
              for="tech-execution"
              class="block text-sm font-medium text-theme mb-1"
              >Execução</label
            >
            <textarea
              name="execution"
              id="tech-execution"
              rows="3"
              maxlength="500"
              class="input block w-full resize-y"
              >{{ technique.execution }}</textarea
            >
          </div>

          <div>
            <label
              for="tech-application"
              class="block text-sm font-medium text-theme mb-1"
              >Aplicação</label
            >
            <textarea
              name="application"
              id="tech-application"
              rows="3"
              maxlength="500"
              class="input block w-full resize-y"
              >{{ technique.application }}</textarea
            >
          </div>

          <div>
            <label
              for="tech-demoUrl"
              class="block text-sm font-medium text-theme mb-1"
              >URL da Demonstração</label
            >
            <input
              type="url"
              name="demoUrl"
              id="tech-demoUrl"
              [value]="technique.demoUrl"
              placeholder="https://www.youtube.com/watch?v=..."
              class="input block w-full"
              autocomplete="off"
              (input)="clearUrlValidity($event)"
            />
          </div>
        </div>

        <!-- Form footer -->
        <div
          class="px-4 sm:px-6 py-4 bg-theme-alt border-t border-theme rounded-b-2xl flex flex-col sm:flex-row justify-end gap-2 sm:gap-3"
        >
          <button
            type="button"
            class="btn order-2 sm:order-1"
            (click)="closed.emit()"
          >
            Cancelar
          </button>
          <button type="submit" class="btn btn-accent order-1 sm:order-2">
            <span
              class="material-symbols-rounded text-[18px]"
              aria-hidden="true"
              >save</span
            >
            Salvar
          </button>
        </div>
      </form>
    </dialog>
  </div>
}
