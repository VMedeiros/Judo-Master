@if (celebration(); as celebration) {
  <section
    class="border-accent-300 bg-accent-50 dark:border-accent-700 dark:bg-accent-900/30 rounded-2xl border-2 p-4 text-center sm:p-6"
    aria-labelledby="celebration-title"
  >
    <div class="mb-2 flex items-center justify-center gap-3">
      <span class="text-4xl sm:text-5xl" aria-hidden="true">{{ celebration.icon }}</span>
      <h2 id="celebration-title" class="text-accent-800 dark:text-accent-200 text-2xl font-bold sm:text-3xl">
        {{ celebration.name }}
      </h2>
      <span class="text-4xl sm:text-5xl" aria-hidden="true">{{ celebration.icon }}</span>
    </div>
    <p class="text-sm font-medium text-gray-700 sm:text-base dark:text-gray-300">Celebrando este momento especial!</p>
  </section>
}
