<div #region class="app-toasts" popover="manual" role="status" aria-live="polite">
  <ul class="flex flex-col gap-2">
    @for (toast of toastService.toasts(); track toast.id) {
      <li
        class="flex items-start gap-3 rounded-xl border px-4 py-3 shadow-lg"
        [class]="classes[toast.type]"
        [attr.role]="toast.type === 'error' ? 'alert' : null"
      >
        <span class="material-symbols-rounded text-xl" aria-hidden="true">{{ icons[toast.type] }}</span>
        <p class="min-w-0 flex-1 text-sm font-semibold">{{ toast.message }}</p>
        @if (toast.action; as action) {
          <button
            type="button"
            class="-my-1 shrink-0 cursor-pointer rounded-lg px-2 py-1 text-sm font-bold underline-offset-2 hover:underline"
            (click)="runAction(toast.id, action)"
          >
            {{ action.label }}
          </button>
        }
        <button
          type="button"
          class="-my-1.5 -mr-2 inline-flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded-lg opacity-80 hover:opacity-100"
          aria-label="Fechar notificação"
          (click)="toastService.dismiss(toast.id)"
        >
          <span class="material-symbols-rounded text-lg" aria-hidden="true">close</span>
        </button>
      </li>
    }
  </ul>
</div>
